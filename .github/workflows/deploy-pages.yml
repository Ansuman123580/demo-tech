name: Deploy static demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static preview
        run: |
          mkdir -p _site
          for path in * .[^.]*; do
            [ -e "$path" ] || continue
            case "$path" in _site|.git|.github) continue ;; esac
            cp -R "$path" _site/
          done
          rm -rf _site/server.py _site/offers.json _site/categories.json _site/uploads _site/admin.html _site/admin.js _site/admin.css
          cat > _site/404.html <<'EOF'
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Page not found</title></head><body style="font-family:system-ui;background:#080b12;color:#fff;padding:4rem"><h1>Page not found</h1><a href="./">Return to the demo</a></body></html>
          EOF
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
